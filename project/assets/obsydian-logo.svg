      <stop offset="0" stop-color="#26262B"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="logoMarkEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A53AFF"/>
