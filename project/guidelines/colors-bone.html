<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bone, the text</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--obsydian);color:var(--bone);font:var(--type-meta)} .g{display:grid;gap:14px} .sw{display:flex;flex-direction:column;gap:6px;min-width:0} .chip{height:56px;border:1px solid var(--hairline)} .n{font:var(--type-caption);color:var(--bone)} .v{font:var(--type-caption);font-size:12px;color:var(--bone-low);font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .lbl{font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;color:var(--bone-low);margin:0 0 12px} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap} .rule{height:1px;background:var(--hairline);margin:22px 0} .note{color:var(--bone-dim);max-width:70ch;margin:0} @media (max-width:699px){.g[style*="repeat("]{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}}</style>
</head><body>
<div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw" style="border:1px solid var(--hairline);padding:18px;gap:14px"><span style="font:var(--type-title-1);font-size:40px;color:var(--bone)">Aa</span><span class="n">--bone</span><span class="v">#F5F4EF</span><span class="v">headlines, values</span></div><div class="sw" style="border:1px solid var(--hairline);padding:18px;gap:14px"><span style="font:var(--type-title-1);font-size:40px;color:var(--bone-dim)">Aa</span><span class="n">--bone-dim</span><span class="v">62%</span><span class="v">ledes, body</span></div><div class="sw" style="border:1px solid var(--hairline);padding:18px;gap:14px"><span style="font:var(--type-title-1);font-size:40px;color:var(--bone-low)">Aa</span><span class="n">--bone-low</span><span class="v">40%</span><span class="v">eyebrows, captions</span></div><div class="sw" style="border:1px solid var(--hairline);padding:18px;gap:14px"><span style="font:var(--type-title-1);font-size:40px;color:var(--bone-faint)">Aa</span><span class="n">--bone-faint</span><span class="v">18%</span><span class="v">barely there</span></div></div>
</body></html>
