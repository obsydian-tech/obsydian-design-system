<!-- @dsCard group="Shape" viewport="760x420" subtitle="6, 10, 16 and the pill, plus the two primary buttons at 18 and 22; hairlines for structure, shadow only for what floats" name="Radius, lines and depth" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Radius, lines and depth</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--obsydian);color:var(--bone);font:var(--type-meta)} .g{display:grid;gap:14px} .sw{display:flex;flex-direction:column;gap:6px;min-width:0} .chip{height:56px;border:1px solid var(--hairline)} .n{font:var(--type-caption);color:var(--bone)} .v{font:var(--type-caption);font-size:12px;color:var(--bone-low);font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .lbl{font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;color:var(--bone-low);margin:0 0 12px} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap} .rule{height:1px;background:var(--hairline);margin:22px 0} .note{color:var(--bone-dim);max-width:70ch;margin:0} @media (max-width:699px){.g[style*="repeat("]{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}}</style>
</head><body>
<div class="g" style="grid-template-columns:repeat(7,1fr)"><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-key)"></div><span class="n">--radius-key</span><span class="v">5 · keys</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-sm)"></div><span class="n">--radius-sm</span><span class="v">6 · tags</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-md)"></div><span class="n">--radius-md</span><span class="v">10 · fields</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-lg)"></div><span class="n">--radius-lg</span><span class="v">16 · brief</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-button)"></div><span class="n">--radius-button</span><span class="v">18 · primary</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-button-lg)"></div><span class="n">--radius-button-lg</span><span class="v">22 · large</span></div><div class="sw" style="align-items:center"><div style="width:100%;aspect-ratio:1.3;background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:var(--radius-pill)"></div><span class="n">--radius-pill</span><span class="v">999 · pills</span></div></div><div class="rule"></div><div class="row" style="gap:28px"><div class="sw"><div style="width:150px;height:56px;border-radius:var(--radius-pill);background:var(--glass);border:1px solid var(--hairline);box-shadow:var(--shadow-pill)"></div><span class="n">--shadow-pill</span><span class="v">nav pill, menus, toasts</span></div><div class="sw"><div style="width:150px;height:56px;border-radius:var(--radius-md);background:var(--field-fill);border:1px solid var(--field-edge);box-shadow:var(--shadow-field)"></div><span class="n">--shadow-field</span><span class="v">sunk in, not raised</span></div><div class="sw"><div style="width:150px;height:56px;border-radius:var(--radius-button);border:3px solid var(--violet-frame);background:var(--fill-primary);box-shadow:var(--shadow-primary)"></div><span class="n">--shadow-primary</span><span class="v">the one glossy button</span></div></div>
</body></html>
