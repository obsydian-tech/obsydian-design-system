<!-- @dsCard group="Colour" viewport="760x330" subtitle="Near-black in four steps; structure is drawn in bone at 8% and 14%, never boxed" name="Surfaces and hairlines" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Surfaces and hairlines</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--obsydian);color:var(--bone);font:var(--type-meta)} .g{display:grid;gap:14px} .sw{display:flex;flex-direction:column;gap:6px;min-width:0} .chip{height:56px;border:1px solid var(--hairline)} .n{font:var(--type-caption);color:var(--bone)} .v{font:var(--type-caption);font-size:12px;color:var(--bone-low);font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .lbl{font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;color:var(--bone-low);margin:0 0 12px} .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap} .rule{height:1px;background:var(--hairline);margin:22px 0} .note{color:var(--bone-dim);max-width:70ch;margin:0} @media (max-width:699px){.g[style*="repeat("]{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}}</style>
</head><body>
<p class="lbl">Surfaces</p><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><div class="chip" style="background:var(--obsydian)"></div><div class="n">--obsydian</div><div class="v">#0A0A0B</div><div class=v>the page</div></div><div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="n">--surface-1</div><div class="v">#131316</div><div class=v>lifted</div></div><div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="n">--surface-2</div><div class="v">#1C1C20</div><div class=v>hover</div></div><div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="n">--surface-3</div><div class="v">#26262B</div><div class=v>pressed</div></div></div>
<div class="rule"></div><p class="lbl">Hairlines</p>
<div class="g" style="grid-template-columns:150px 1fr;align-items:center;max-width:620px"><span class="v">--hairline · 8%</span><span style="height:1px;background:var(--hairline)"></span><span class="v">--hairline-strong · 14%</span><span style="height:1px;background:var(--hairline-strong)"></span><span class="v">--hairline-hover · 22%</span><span style="height:1px;background:var(--hairline-hover)"></span><span class="v">--rule-w · violet</span><span style="height:1px;width:40px;background:var(--violet)"></span></div>
</body></html>
